name: Regenerate profile dashboard

on:
  push:
    branches: [main]
    paths:
      - "metrics.json"
      - "scripts/gen_dashboard.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate dashboard
        run: python scripts/gen_dashboard.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet profile_dashboard.png; then
            echo "No changes to dashboard"
          else
            git add profile_dashboard.png
            git commit -m "ci: auto-regenerate dashboard from metrics.json"
            git push
          fi
